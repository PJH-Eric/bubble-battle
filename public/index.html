<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#BFE7F5">
<title>泡泡大作戰</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='12' fill='%234FC0E8' stroke='%232E9BC4' stroke-width='2'/%3E%3Ccircle cx='11' cy='12' r='3.5' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<button id="btn-settings" class="icon-btn" aria-label="設定" title="設定">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Zm8.4 3.5a8.4 8.4 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a8.2 8.2 0 0 0-2-1.2L15.6 3h-3.9l-.4 2.6a8.2 8.2 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a8.4 8.4 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a8.2 8.2 0 0 0 2 1.2l.4 2.6h3.9l.4-2.6a8.2 8.2 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.06-.4.1-.8.1-1.2Z"/></svg>
</button>

<nav id="screen-nav" class="screen-nav" aria-label="畫面導覽">
  <button id="btn-back" class="nav-btn" type="button">← 返回</button>
</nav>

<!-- ===== 首頁 ===== -->
<section id="screen-home" class="screen active">
  <a class="nav-btn lobby-home-link" href="https://pjh-eric.github.io/game-lobby/" aria-label="回遊戲大廳">← 回遊戲大廳</a>
  <div class="home-art">
    <svg viewBox="0 0 320 150" aria-hidden="true">
      <ellipse cx="160" cy="132" rx="130" ry="12" fill="#000" opacity=".07"/>
      <g id="home-cast"></g>
      <g id="home-bubbles"></g>
    </svg>
  </div>
  <h1 class="title">泡泡大作戰</h1>
  <p class="subtitle">丟水球、困住對手、最後一個站著的就贏了</p>
  <div class="home-buttons">
    <button class="big-btn primary" data-go="setup">一個人玩</button>
    <button class="big-btn" data-go="online">跟別人玩</button>
    <button class="big-btn ghost" data-go="help">怎麼玩</button>
  </div>
  <p class="foot-note" id="home-stats"></p>
</section>

<!-- ===== 單機設定 ===== -->
<section id="screen-setup" class="screen">
  <div class="panel single-setup">
    <div class="setup-heading">
      <div>
        <h2>一個人玩</h2>
        <p>選好角色與對手，馬上開始挑戰</p>
      </div>
    </div>

    <div class="setup-grid">
      <section class="setup-block setup-player">
        <h3>玩家</h3>
        <label class="field">
          <span>你的名字</span>
          <input id="in-nickname" type="text" maxlength="6" placeholder="小玩家">
        </label>

        <div class="field">
          <span>選一隻角色</span>
          <div id="char-picker" class="picker"></div>
        </div>
      </section>

      <section class="setup-block setup-opponents">
        <div class="setup-block-head">
          <h3>電腦對手</h3>
          <span>最多 7 個</span>
        </div>
        <div class="stepper">
          <button type="button" class="round-btn" id="ai-minus" aria-label="少一個電腦">−</button>
          <span class="stepper-num"><b id="ai-count-label">3</b> 個</span>
          <button type="button" class="round-btn" id="ai-plus" aria-label="多一個電腦">＋</button>
        </div>
        <div id="ai-levels" class="ai-levels"></div>
      </section>

      <section class="setup-block setup-world">
        <div class="setup-block-head">
          <h3>遊戲環境</h3>
          <span>每局開始前都能調整</span>
        </div>
        <div class="setup-world-grid">
          <label class="field">
            <span>地圖</span>
            <select id="in-map"></select>
          </label>

          <label class="field">
            <span>場景外觀</span>
            <select id="in-field"></select>
          </label>
        </div>
      </section>
    </div>

    <div class="row-btns setup-actions">
      <button class="big-btn primary" id="btn-start">開始遊戲</button>
    </div>
  </div>
</section>

<!-- ===== 大廳 ===== -->
<section id="screen-lobby" class="screen">
  <div class="panel lobby">
    <div class="lobby-head">
      <h2>跟別人玩</h2>
      <label class="lobby-name">你的名字
        <input id="lobby-nickname" type="text" maxlength="6" placeholder="小玩家" autocomplete="off">
      </label>
      <span id="conn-state" class="conn">連線中…</span>
    </div>
    <div class="row-btns lobby-actions">
      <button class="big-btn primary" id="btn-quick">快速加入</button>
      <button class="big-btn" id="btn-create">建立房間</button>
    </div>
    <div class="room-list-head">
      <div class="room-list-label">
        <h3>房間列表</h3>
        <span id="room-list-status" class="room-list-status" aria-live="polite"></span>
      </div>
      <button id="btn-refresh-room" class="mini-btn" type="button">↻ 重新整理房間</button>
    </div>
    <div id="room-list" class="room-list"></div>
  </div>
</section>

<!-- ===== 房間 ===== -->
<section id="screen-room" class="screen">
  <div class="panel room">
    <div class="room-head">
      <div>
        <p class="eyebrow">線上房間</p>
        <h2 id="room-title">房間</h2>
      </div>
    </div>

    <section class="room-section room-settings" aria-labelledby="room-settings-title">
      <div class="section-head">
        <h3 id="room-settings-title">房間設定</h3>
        <span>房主可調整</span>
      </div>
      <div id="room-setup" class="room-setup"></div>
    </section>

    <section class="room-section room-seats" aria-labelledby="seat-title">
      <div class="section-head seats-head">
        <h3 id="seat-title">席位</h3>
        <span id="seat-count"></span>
      </div>
      <ul id="seat-list" class="seat-list"></ul>
      <div id="ai-row" class="row-btns ai-row"></div>
      <div id="spectator-line" class="spectators"></div>
    </section>

    <div class="room-actions">
      <div class="room-actions-secondary">
        <button class="mini-btn" id="btn-seat-toggle">改成觀戰</button>
        <button class="mini-btn" id="btn-invite">邀請連結</button>
      </div>
      <div class="room-actions-primary">
        <button class="big-btn" id="btn-ready">準備好了</button>
        <button class="big-btn primary" id="btn-host-start">開始遊戲</button>
      </div>
    </div>
    <div id="invite-box" class="invite-box" hidden></div>
  </div>
</section>

<!-- ===== 聊天室（房間與對戰共用，固定在左下角） ===== -->
<div id="chat-dock" class="chat-dock" hidden>
  <button id="chat-toggle" class="chat-toggle">
    <span>聊天室</span><span id="chat-unread" class="unread" hidden>0</span>
  </button>
  <div id="chat-panel" class="chat-panel" hidden>
    <div id="chat-log" class="chat-log"></div>
    <div id="chat-quick" class="chat-quick"></div>
    <form id="chat-form" class="chat-form">
      <input id="chat-input" type="text" maxlength="60" placeholder="說點什麼…" autocomplete="off">
      <button class="mini-btn" type="submit">送出</button>
    </form>
  </div>
</div>

<!-- ===== 對戰 ===== -->
<section id="screen-game" class="screen game">
  <aside id="summary" class="summary">
    <div class="sum-top">
      <div class="clock" id="clock">3:00</div>
      <div class="map-name" id="sum-map"></div>
      <div class="watch-badge" id="watch-badge" hidden>觀戰中</div>
    </div>
    <ul id="sum-players" class="sum-players"></ul>
    <div class="sum-mine" id="sum-mine"></div>
    <div class="sum-flash" id="sum-flash"></div>
    <button class="mini-btn" id="btn-quit">離開這局</button>
  </aside>

  <div class="board-wrap" id="board-wrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="countdown" id="countdown" hidden><span></span></div>
    <div class="rotate-tip" id="rotate-tip" hidden>
      <p>轉成橫向比較好玩喔</p>
      <button class="mini-btn" id="btn-rotate-ok">知道了</button>
    </div>
  </div>

  <div class="touch" id="touch">
    <div class="stick-wrap" id="stick-wrap">
      <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
    </div>
    <button class="drop-btn" id="drop" aria-label="放水球">
      <svg viewBox="-1 -1 2 2" aria-hidden="true"><circle r="0.72" fill="#4FC0E8" stroke="#2E9BC4" stroke-width="0.1"/><circle cx="-0.24" cy="-0.26" r="0.19" fill="#fff" opacity=".8"/></svg>
    </button>
  </div>
</section>

<!-- ===== 結算 ===== -->
<section id="screen-result" class="screen">
  <div class="panel result">
    <div class="winner-art"><svg id="winner-svg" viewBox="-1 -1.4 2 2.4"></svg></div>
    <h2 id="result-title">勝利！</h2>
    <p id="result-line" class="result-line"></p>
    <div class="row-btns">
      <button class="big-btn primary" id="btn-again">再來一局</button>
    </div>
  </div>
</section>

<!-- ===== 怎麼玩 ===== -->
<section id="screen-help" class="screen">
  <div class="panel help">
    <h2>怎麼玩</h2>
    <div id="help-body"></div>
    <div class="row-btns"><button class="big-btn primary" data-go="home">我知道了</button></div>
  </div>
</section>

<!-- ===== 設定 ===== -->
<div id="modal-settings" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="設定">
    <h2>設定</h2>
    <label class="toggle"><input type="checkbox" id="set-bgm"> <span>背景音樂</span></label>
    <input type="range" id="set-bgm-vol" min="0" max="1" step="0.05">
    <label class="toggle"><input type="checkbox" id="set-sfx"> <span>音效</span></label>
    <input type="range" id="set-sfx-vol" min="0" max="1" step="0.05">
    <label class="toggle"><input type="checkbox" id="set-motion"> <span>減少動態</span></label>
    <div class="field">
      <span>觸控操作方式</span>
      <select id="set-control">
        <option value="stick">左下虛擬搖桿</option>
        <option value="swipe">全螢幕滑動</option>
      </select>
    </div>
    <div class="row-btns">
      <button class="mini-btn" id="set-reset">恢復預設</button>
      <button class="mini-btn danger" id="set-clear">清除戰績</button>
      <button class="big-btn primary" id="set-close">關閉</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/rng.js"></script>
<script src="js/maps.js"></script>
<script src="js/rules.js"></script>
<script src="js/ai.js"></script>
<script src="js/themes/characters.js"></script>
<script src="js/themes/fields.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/online.js"></script>
<script src="js/net.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
