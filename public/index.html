<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#BFE7F5">
<title>泡泡大作戰</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<button id="btn-settings" class="icon-btn" aria-label="設定" title="設定">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Zm8.4 3.5a8.4 8.4 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a8.2 8.2 0 0 0-2-1.2L15.6 3h-3.9l-.4 2.6a8.2 8.2 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a8.4 8.4 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a8.2 8.2 0 0 0 2 1.2l.4 2.6h3.9l.4-2.6a8.2 8.2 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.06-.4.1-.8.1-1.2Z"/></svg>
</button>

<!-- ===== 首頁 ===== -->
<section id="screen-home" class="screen active">
  <div class="home-art">
    <svg viewBox="0 0 320 150" aria-hidden="true">
      <ellipse cx="160" cy="132" rx="130" ry="12" fill="#000" opacity=".07"/>
      <g id="home-cast"></g>
      <g id="home-bubbles"></g>
    </svg>
  </div>
  <h1 class="title">泡泡大作戰</h1>
  <p class="subtitle">丟水球、困住對手、最後一個站著的就贏了</p>
  <div class="home-buttons">
    <button class="big-btn primary" data-go="setup">一個人玩</button>
    <button class="big-btn" data-go="online">跟別人玩</button>
    <button class="big-btn ghost" data-go="help">怎麼玩</button>
  </div>
  <p class="foot-note" id="home-stats"></p>
</section>

<!-- ===== 單機設定 ===== -->
<section id="screen-setup" class="screen">
  <div class="panel">
    <h2>一個人玩</h2>

    <label class="field">
      <span>你的名字</span>
      <input id="in-nickname" type="text" maxlength="6" placeholder="小玩家">
    </label>

    <div class="field">
      <span>選一隻角色</span>
      <div id="char-picker" class="picker"></div>
    </div>

    <div class="field">
      <span>電腦對手</span>
      <div class="stepper">
        <button type="button" class="round-btn" id="ai-minus" aria-label="少一個電腦">−</button>
        <span class="stepper-num"><b id="ai-count-label">3</b> 個</span>
        <button type="button" class="round-btn" id="ai-plus" aria-label="多一個電腦">＋</button>
      </div>
      <div id="ai-levels" class="ai-levels"></div>
    </div>

    <div class="field">
      <span>地圖</span>
      <select id="in-map"></select>
    </div>

    <div class="field">
      <span>場景外觀</span>
      <select id="in-field"></select>
    </div>

    <div class="row-btns">
      <button class="big-btn ghost" data-go="home">回首頁</button>
      <button class="big-btn primary" id="btn-start">開始遊戲</button>
    </div>
  </div>
</section>

<!-- ===== 對戰 ===== -->
<section id="screen-game" class="screen game">
  <aside id="summary" class="summary">
    <div class="sum-top">
      <div class="clock" id="clock">3:00</div>
      <div class="map-name" id="sum-map"></div>
    </div>
    <ul id="sum-players" class="sum-players"></ul>
    <div class="sum-mine" id="sum-mine"></div>
    <div class="sum-flash" id="sum-flash"></div>
    <button class="mini-btn" id="btn-quit">離開這局</button>
  </aside>

  <div class="board-wrap" id="board-wrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="countdown" id="countdown" hidden><span></span></div>
    <div class="rotate-tip" id="rotate-tip" hidden>
      <p>轉成橫向比較好玩喔</p>
      <button class="mini-btn" id="btn-rotate-ok">知道了</button>
    </div>
  </div>

  <div class="touch" id="touch">
    <div class="stick-wrap" id="stick-wrap">
      <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
    </div>
    <button class="drop-btn" id="drop" aria-label="放水球">
      <svg viewBox="-1 -1 2 2" aria-hidden="true"><circle r="0.72" fill="#4FC0E8" stroke="#2E9BC4" stroke-width="0.1"/><circle cx="-0.24" cy="-0.26" r="0.19" fill="#fff" opacity=".8"/></svg>
    </button>
  </div>
</section>

<!-- ===== 結算 ===== -->
<section id="screen-result" class="screen">
  <div class="panel result">
    <div class="winner-art"><svg id="winner-svg" viewBox="-1 -1.4 2 2.4"></svg></div>
    <h2 id="result-title">勝利！</h2>
    <p id="result-line" class="result-line"></p>
    <div class="row-btns">
      <button class="big-btn ghost" data-go="home">回首頁</button>
      <button class="big-btn primary" id="btn-again">再來一局</button>
    </div>
  </div>
</section>

<!-- ===== 怎麼玩 ===== -->
<section id="screen-help" class="screen">
  <div class="panel help">
    <h2>怎麼玩</h2>
    <div id="help-body"></div>
    <div class="row-btns"><button class="big-btn primary" data-go="home">我知道了</button></div>
  </div>
</section>

<!-- ===== 設定 ===== -->
<div id="modal-settings" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-label="設定">
    <h2>設定</h2>
    <label class="toggle"><input type="checkbox" id="set-bgm"> <span>背景音樂</span></label>
    <input type="range" id="set-bgm-vol" min="0" max="1" step="0.05">
    <label class="toggle"><input type="checkbox" id="set-sfx"> <span>音效</span></label>
    <input type="range" id="set-sfx-vol" min="0" max="1" step="0.05">
    <label class="toggle"><input type="checkbox" id="set-motion"> <span>減少動態</span></label>
    <div class="field">
      <span>觸控操作方式</span>
      <select id="set-control">
        <option value="stick">左下虛擬搖桿</option>
        <option value="swipe">全螢幕滑動</option>
      </select>
    </div>
    <div class="row-btns">
      <button class="mini-btn" id="set-reset">恢復預設</button>
      <button class="mini-btn danger" id="set-clear">清除戰績</button>
      <button class="big-btn primary" id="set-close">關閉</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/rng.js"></script>
<script src="js/maps.js"></script>
<script src="js/rules.js"></script>
<script src="js/ai.js"></script>
<script src="js/themes/characters.js"></script>
<script src="js/themes/fields.js"></script>
<script src="js/render.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
